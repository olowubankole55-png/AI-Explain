kind = "web"
previewPath = "/"
title = "AI Explain"
description = "A student-friendly learning assistant that turns difficult questions into clear, accurate explanations with a secure AI backend."
version = "1.0.0"
id = "artifacts/ai-explain"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20824

[services.development]
run = "pnpm --filter @workspace/ai-explain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-explain", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-explain/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20824"
BASE_PATH = "/"
